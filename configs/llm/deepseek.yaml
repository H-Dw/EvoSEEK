# DeepSeek V4 via Chat Completions. The key stays in `.env` / the process environment.
# Never put a literal sk-... value in this file or in experiment YAML.
provider: deepseek
profile: scientific_v1
# model: deepseek-v4-flash
model: deepseek-v4-pro
base_url: https://api.deepseek.com
api_key: env:DEEPSEEK_API_KEY
temperature: 0.0
max_tokens: 32768
reasoning_effort: high
thinking: enabled
max_transport_retries: 2
max_truncation_retries: 1
max_syntax_retries: 1
max_schema_retries: 2
max_semantic_retries: 1
max_unknown_evidence_retries: 1
retry_backoff_seconds: 1.0
request_timeout_seconds: 120.0
allow_unknown_evidence_stripping: false
max_input_chars: 160000
rethink_max_tokens: 49152
rethink_render_max_tokens: 32768
rethink_reasoning_effort: null
rethink_thinking: disabled
rethink_reasoning_batch_size: 1
rethink_max_parallel_batches: 8
rethink_max_calls_per_round: 256
rethink_call_reserve: 96
rethink_dimension_parallel: true
rethink_parallel_dimension_groups: true
