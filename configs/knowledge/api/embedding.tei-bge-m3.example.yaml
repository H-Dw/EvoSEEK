schema_version: embedding-api:v1
provider: tei
endpoint: "https://<YOUR_TEI_HOST>/v1/embeddings"
api_key: "${TEI_API_KEY}"
model: BAAI/bge-m3
model_family: bge
model_revision: "REPLACE_WITH_PINNED_HF_COMMIT"
dimension: 1024
max_input_tokens: 8192
batch_size: 32
timeout_seconds: 60
max_retries: 3
query_task: null
document_task: null
query_instruction: null
document_instruction: null
query_prefix: ""
document_prefix: ""
tokenizer_model_path: null
tokenizer_model_id: BAAI/bge-m3
tokenizer_revision: "REPLACE_WITH_PINNED_HF_COMMIT"
normalize_embeddings: true
