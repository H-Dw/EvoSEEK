schema_version: embedding-api:v1
provider: jina
endpoint: "https://api.jina.ai/v1/embeddings"
api_key: "${JINA_API_KEY}"
model: jina-embeddings-v5-text-small
model_family: jina
model_revision: "provider-managed:2026-02-18"
dimension: 1024
max_input_tokens: 32768
batch_size: 32
timeout_seconds: 30
max_retries: 3
query_task: retrieval.query
document_task: retrieval.passage
query_instruction: null
document_instruction: null
query_prefix: ""
document_prefix: ""
tokenizer_model_path: null
tokenizer_model_id: jinaai/jina-embeddings-v5-text-small
tokenizer_revision: "provider-managed:2026-02-18"
normalize_embeddings: true
