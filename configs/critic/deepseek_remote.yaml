enabled: true
mode: remote
provider: deepseek
model: deepseek-v4-flash
base_url: https://api.deepseek.com
api_key: env:DEEPSEEK_API_KEY
temperature: 0.0
max_revision_attempts: 2
max_model_retries: 2
max_truncation_retries: 1
max_syntax_retries: 1
max_schema_retries: 2
max_semantic_retries: 1
max_unknown_evidence_retries: 1
retry_backoff_seconds: 1.0
request_timeout_seconds: 120.0
max_input_chars: 160000
on_reject: abort_round
on_exhausted: abort_round
fallback_policy: rule
require_counterevidence_search: false
rationale_visibility: structured_claims_only
profile: scientific_v1
ood_warning_threshold: null
model_disagreement_threshold: null
min_batch_distance: 1
review_controls: true
review_diversity: true
max_tokens: 20000
thinking: disabled
