# Profiles for the kg_interaction package. The knowledge-agent runtime uses bounded_agentic
# semantics by default and still supports operator-level ablations.
profiles:
  one_shot_context:
    enabled_operators: [hypothesis_context]
    max_tool_calls: 1
    use_counterevidence: false
    stop_when_sufficient: true
    read_only: true

  bounded_agentic:
    enabled_operators: [hypothesis_context, explain_variant, compare_variants]
    max_tool_calls: 3
    use_counterevidence: true
    stop_when_sufficient: true
    read_only: true

  no_counterevidence:
    enabled_operators: [hypothesis_context, explain_variant, compare_variants]
    max_tool_calls: 3
    use_counterevidence: false
    stop_when_sufficient: true
    read_only: true

  query_only_no_early_stop:
    enabled_operators: [hypothesis_context, explain_variant, compare_variants]
    max_tool_calls: 3
    use_counterevidence: true
    stop_when_sufficient: false
    read_only: true

  feature_channels:
    enabled_operators: [hypothesis_context, explain_variant, compare_variants,
      query_physchem_delta, query_evolutionary_profile, query_structure_environment,
      query_feature_bundle,
      query_assay_association, query_evidence_provenance, query_local_knowledge,
      query_structured_claims]
    max_tool_calls: 8
    feature_tool_strategy: independent
    feature_channels: [physchem, conservation, structure]
    feature_variant_limit: 1
    use_counterevidence: true
    stop_when_sufficient: false
    read_only: true

  joint_feature_bundle:
    enabled_operators: [hypothesis_context, query_feature_bundle]
    max_tool_calls: 2
    feature_tool_strategy: joint
    feature_channels: [physchem, conservation, structure]
    feature_variant_limit: 1
    use_counterevidence: true
    stop_when_sufficient: false
    read_only: true

  proposal_writeback:
    enabled_operators: [hypothesis_context, explain_variant, compare_variants]
    max_tool_calls: 3
    use_counterevidence: true
    stop_when_sufficient: true
    read_only: false
