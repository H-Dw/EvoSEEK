# Opt-in profiles for the optional kg_knowledge construction pipeline.
# Entity/relation filters can be added per experiment for finer-grained ablations.
profiles:
  observations_only:
    enabled_adapters: [campaign_observations]
    enabled_layers: [identity, experimental, sequence, provenance]
    enabled_modalities: [tabular, sequence, time_series]

  core_with_models:
    enabled_adapters: [campaign_observations, inference_records]
    enabled_layers: [identity, experimental, sequence, model, agent, provenance]
    enabled_modalities: [tabular, sequence, text, time_series]

  full_multimodal:
    enabled_adapters: null
    enabled_layers: null
    enabled_modalities: null

  no_structure:
    enabled_adapters: null
    enabled_layers: [identity, experimental, sequence, atom_chemistry, evolutionary,
      functional, model, literature, agent, provenance]
    enabled_modalities: [tabular, sequence, atomic, msa, text, embedding, time_series,
      ontology]

  no_evolution:
    enabled_adapters: null
    enabled_layers: [identity, experimental, sequence, structure, atom_chemistry,
      functional, model, literature, agent, provenance]
    enabled_modalities: [tabular, sequence, structure_3d, atomic, text, embedding,
      time_series, ontology]

  no_literature:
    enabled_adapters: null
    enabled_layers: [identity, experimental, sequence, structure, atom_chemistry,
      evolutionary, functional, model, agent, provenance]
    enabled_modalities: [tabular, sequence, structure_3d, atomic, msa, embedding,
      time_series, ontology]

