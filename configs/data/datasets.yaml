          - "https://raw.githubusercontent.com/J-SNACKKB/FLIP/main/splits/gb1/four_mutations_full_data.csv.zip"
        sha256: "85692d808dcd3ae54fa2ac31f4e590858d4582369b6c7b05df299b9b6c383bff"
        archive_type: zip
        extract: true
        extract_members: ["four_mutations_full_data.csv"]
        min_bytes: 1000000
      - name: README.md
        target: UPSTREAM_README.md
        optional: true
        sha256: "a458c5f106b18d4d7e8ce5461c817e34c3c96e907c23d56e43550f02d6a7adf9"
        urls:
          - "https://raw.githubusercontent.com/J-SNACKKB/FLIP/62cace8735f5610e2743cf06ce0f944b37fffaa6/splits/gb1/README.md"
