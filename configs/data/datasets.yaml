    citation: "Wu_2016; Dallago_2021"
    adapter: flip_gb1
    task_type: sequence_fitness
    fitness_direction: maximize
    supports: {substitutions: true, indels: false, multiple_mutants: true}
    dest: data/raw/flip/gb1
    files:
      - name: four_mutations_full_data.csv.zip
        urls:
