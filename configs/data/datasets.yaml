# Data source registry for EvoSEEK.
#
# Every external dataset is declared here exactly once. Downloaders
# (scripts/data/download_profile.py and its wrappers) resolve datasets by id,
# so adding a new dataset never requires a new hardcoded curl script.
#
# File entry fields:
#   name            upstream file name (also the local name unless `target` is set)
#   urls            ordered list; first reachable + checksum-passing URL wins
#   sha256          pinned hex digest; null = trust-on-first-use (recorded in the
#                   manifest with sha256_pinned=false, pin it here afterwards)
#   optional        download failure degrades to a warning instead of an error
#   archive_type    zip | gz | none      (gz = single-file gzip)
#   extract         extract archive after verification
#   extract_members whitelist of exact names or glob patterns; matched against
#                   both the full member path and its basename. Empty = extract all.
#   keep_archive    keep the archive file after extraction (default true)
#   min_bytes       sanity lower bound on file size
#
# Dataset entry fields:
#   version         pinned upstream version/commit. Never track a moving branch
#                   as the primary reference.
#   source_type     flip | flip2 | proteingym | pdb
#   adapter         adapter key used by the data layer (see src/fitness_agents/data)
#   fitness_direction  maximize | minimize (loaders normalize to maximize)
#   expected_min_rows  per-CSV lower bounds checked by validate_downloads.py

version: 1
notes:
  flip_commit: &flip_commit "62cace8735f5610e2743cf06ce0f944b37fffaa6"
  proteingym_commit: &pg_commit "144fe22b07dfaeec2b366f2346203a9838a55b4c"
