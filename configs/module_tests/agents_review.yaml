seed: 20260816
output_dir: artifacts/module_tests/agents_review
batch_budget: 3
max_revision_attempts: 1
critic:
  enabled: true
  mode: rule
  provider: mock
  model: null
  temperature: 0.0
  max_revision_attempts: 1
  max_model_retries: 1
  on_reject: abort_round
  on_exhausted: abort_round
  fallback_policy: rule
  require_counterevidence_search: false
  rationale_visibility: structured_claims_only
  profile: scientific_v1
  ood_warning_threshold: 0.8
  model_disagreement_threshold: 0.5
  min_batch_distance: 1

# Offline mode is the default. To exercise the real API, pass --enable-remote.
# The API key is read from env:DEEPSEEK_API_KEY / .env and is never written to artifacts.
remote_llm:
  enabled: false
  provider: openai_compatible
  api_key: env:DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  scientist_model: deepseek-v4-flash
  critic_model: deepseek-v4-flash
  reasoning_effort: high
  thinking: enabled
  max_tokens: 32768
