# Reference block for formal three-channel runs. Experiment YAMLs copy this
# mapping under `hierarchical_hypothesis` because the project loader deliberately
# avoids implicit nested includes.
enabled: true
required_channels: [physchem, conservation, structure]
max_parallel_branches: 3
child_sample_batch_size: 8
child_max_parallel_batches: 2
max_child_revision_attempts: 1
max_main_revision_attempts: 2
formal_fail_closed: true
child_scientist_profiles:
  physchem: physchem_v1
  conservation: conservation_v1
  structure: structure_v1
child_critic_profiles:
  physchem: physchem_v1
  conservation: conservation_v1
  structure: structure_v1
main_scientist_profile: synthesis_v1
main_critic_profile: hypothesis_v1
child_max_tokens: 32768
child_critic_max_tokens: 32768
main_critic_max_tokens: 32768
