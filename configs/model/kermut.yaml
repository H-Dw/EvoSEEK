# Real Kermut backend using the official composite-kernel GP implementation.
# This host: driver 530.41.03 / CUDA 12.1, 4x RTX 3090 24GB. Requires
# torch 2.5.1+cu121 in the fitness-agents conda env (default pip torch is cu130
# and will fail with "NVIDIA driver too old"). Parallel campaign runners pin each
# worker with CUDA_VISIBLE_DEVICES so this file can keep device: cuda:0. Launch
# with --cuda-devices 0,1,2,3 (or auto) and --max-parallel 4.
name: kermut
device: cuda:0
allow_device_fallback: false
# 265-aa FLIP fusion + ESM-2 650M. 8 is safe on a shared 3090 with ~7–10GB free;
# raise to 16–32 only when the card is exclusive.
batch_size: 8
backend_factory: fitness_agents.models.backends.kermut:create_backend
# Local ESM-2 650M weights. Always unpickled onto CPU, then moved to `device`.
# fair-esm's hub loader is only used when this is null.
# The file is the official Facebook checkpoint; co-locate
# esm2_t33_650M_UR50D-contact-regression.pt in the same directory.
checkpoint: ~/.cache/torch/hub/checkpoints/esm2_t33_650M_UR50D.pt
options:
  wild_type_sequence: null  # Inferred from observed mutation_count=0 variants.
  feature_mode: live_esm2  # Or precomputed. live_esm2 looks up precomputed_features_path first.
  precomputed_features_path: null  # Optional NPZ library (variant_ids or sequences + embeddings + zero_shot).
  esm_model: esm2_t33_650M_UR50D
  esm_representation_layer: 33
  cache_dir: artifacts/model_cache/kermut_esm2
  # GB1 site-only ProteinMPNN probabilities (4 x 20) and C-alpha coords (4 x 3).
  # Generated by scripts/models/prepare_kermut_gb1_resources.py from PDB 1PGA.
  # Four-site tables such as VDGV match these arrays directly; 265-aa fusion
  # sequences are mapped through resource_positions.
  conditional_probs_path: models/kermut/gb1_sites_conditional_probs.npy
  coords_path: models/kermut/gb1_sites_coords.npy
  resource_positions: [39, 40, 41, 54]
  positions_are_one_indexed: true
  composition: weighted_sum
  noise_prior_scale: 0.1
  h_lengthscale: 1.0
  d_lengthscale: 1.0
  p_lengthscale: 1.0
  learning_rate: 0.1
  n_steps: 150
  progress_bar: false
  use_zero_shot_mean: true
  use_validation_conformal: false
  conformal_alpha: 0.10
