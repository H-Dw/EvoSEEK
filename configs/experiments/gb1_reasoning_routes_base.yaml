mode: knowledge_agent
seed: 11
rounds: 3
budget_per_round: 16
# Score only this many remaining variants per round. 0 = full remaining oracle pool.
candidate_limit: 32
acquisition: greedy
ucb_beta: 1.5
diversity_lambda: 0.10
task_config: configs/task/gb1_binding_reasoning_routes.yaml
model_config: configs/model/kermut.yaml
knowledge_config: configs/knowledge/gb1_reasoning_routes.yaml
output_root: artifacts/runs/reasoning-routes
llm_config: configs/llm/deepseek.yaml
# Remote LLM critic; rule fallback is only for API failure, not a mock critic.
critic_config: configs/critic/deepseek_remote.yaml
knowledge_enabled: true
condition: route_base
generation:
  selection_driver: agent_uq
  use_fitness_predictors: false
  predictor_models: []
  hypothesis_weight: 1.0
  evidence_weight: 0.65
  prior_weight: 0.80
  uncertainty_beta: 0.75
  predictor_weight: 0.0
  gp_length_scale: 1.0
  hypothesis_recency_decay: 0.85
  # Same 16-budget allocation as configs/experiments/knowledge_agent_al96.yaml.
  # Agent-UQ routes keep this; the active-learning route disables it in apply_route.
  quota_allocation:
    enabled: true
    hypothesis_target: 8
    evidence_prior: 3
    coverage_exploration: 3
    matched_control: 2
    strong_hypothesis_threshold: 0.75
active_learning:
  enabled: false
  module: lightweight_calibrated_hybrid
  posterior:
    plugin: visible_holdout_ensemble
    predictor_models: [configs/model/kermut.yaml]
    calibration_fraction: 0.20
    min_calibration_size: 8
    min_training_size: 8
    conformal_alpha: 0.10
    min_std: 1.0e-6
    variance_scale_bounds: [0.25, 4.0]
    refit_full: true
  acquisition:
    plugin: hybrid_batch
    # 16-budget integer quotas: exploitation=8, exploration=4, knowledge=4.
    exploitation_fraction: 0.50
    exploration_fraction: 0.25
    knowledge_fraction: 0.25
    ucb_beta: 1.0
    diversity_lambda: 0.10
    ood_penalty: 0.25
    knowledge_fitness_weight: 0.25
    validation_prior_weight: 1.0
validation:
  enabled: true
  predictor_models: []
  wet_weight: 1.0
  dry_weight_cap: 0.20
  recency_decay: 0.85
  rethink_enabled: true
evaluation:
  metrics: [spearman, pearson, mse, rmse, ndcg, top_k_hit, top_k_recall,
    regret_at_k, interval_90_coverage, gaussian_nll]
  top_k: 10
output:
  artifacts: [json, csv, markdown, svg, reasoning]
  top_k: 16
kg_interaction:
  enabled: true
  enabled_operators: [hypothesis_context, explain_variant, compare_variants,
    query_feature_bundle, query_kg_truncation_audit, query_assay_association,
    query_evidence_provenance, query_local_knowledge, query_structured_claims]
  feature_tool_strategy: joint
  feature_channels: [physchem, conservation, structure]
  feature_variant_limit: 2
  truncation_audit_enabled: true
  truncation_audit_items: [MutationEffectEstimate, HAS_MUTATION, ABOUT_MUTATION,
    HAS_PHYSCHEM_DELTA, HAS_EVOLUTIONARY_CONTEXT, OCCURS_IN_ENVIRONMENT]
  truncation_audit_sample_rows: 3
  max_tool_calls: 12
  max_rows: 24
  use_counterevidence: true
  stop_when_sufficient: false
