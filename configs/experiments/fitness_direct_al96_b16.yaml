mode: fitness_direct
seed: 42
rounds: 3
budget_per_round: 16
# Kermut acquisition inference ranks this bounded proposal pool; only the selected
# batch enters dry validation and oracle measurement.
candidate_limit: 32
acquisition: greedy
ucb_beta: 1.5
diversity_lambda: 0.0
task_config: configs/task/gb1_binding_al96.yaml
model_config: configs/model/kermut.yaml
knowledge_config: configs/knowledge/gb1.yaml
output_root: artifacts/runs
llm_provider: mock
knowledge_enabled: false
score_shuffle: false
evidence_deletion: false
run_label: al96-b16
condition: fitness_direct
generation:
  selection_driver: predictor
  use_fitness_predictors: true
  predictor_models: []
kg_interaction:
  enabled: false
validation:
  enabled: true
  predictor_models: []
  wet_weight: 1.0
  dry_weight_cap: 0.20
  recency_decay: 0.85
  rethink_enabled: true
evaluation:
  metrics: [spearman, pearson, mse, rmse, ndcg, top_k_hit, top_k_recall,
    regret_at_k, interval_90_coverage, gaussian_nll]
  top_k: 10
output:
  artifacts: [json, csv, markdown, svg, reasoning]
  top_k: 16
