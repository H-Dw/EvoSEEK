# Formal three-channel hierarchical Scientist on GB1 AL96.
# Protocol: 3 rounds x budget 16, Agent-UQ 8/3/3/2, DeepSeek V4 Flash.
# Launch same-task folds in parallel with scripts/run_hierarchical_scientist.py.
# Default matrix: kg_base, kg_base_rag, kg_base_al, kg_3features_rag x 3 folds.
# --max-parallel 6 runs them in two waves in that condition order.
mode: knowledge_agent
seed: 11
rounds: 3
budget_per_round: 16
candidate_limit: 64
scientist_prompt_evidence_limit: 32
acquisition: greedy
ucb_beta: 1.5
diversity_lambda: 0.10
task_config: configs/task/gb1_binding_reasoning_routes.yaml
model_config: configs/model/baseline.yaml
knowledge_config: configs/knowledge/gb1_features.example.yaml
output_root: artifacts/runs/hierarchical-scientist
llm_config: configs/llm/deepseek.yaml
critic_config: configs/critic/deepseek_remote.yaml
knowledge_enabled: true
score_shuffle: false
evidence_deletion: false
condition: hierarchical
generation:
  selection_driver: agent_uq
  use_fitness_predictors: false
  predictor_models: []
  hypothesis_weight: 1.0
  evidence_weight: 0.65
  prior_weight: 0.80
  uncertainty_beta: 0.75
  predictor_weight: 0.0
  gp_length_scale: 1.0
  hypothesis_recency_decay: 0.85
  quota_allocation:
    enabled: true
    hypothesis_target: 8
    evidence_prior: 3
    coverage_exploration: 3
    matched_control: 2
    strong_hypothesis_threshold: 0.75
active_learning:
  enabled: false
  module: lightweight_calibrated_hybrid
  posterior:
    plugin: visible_holdout_ensemble
    predictor_models: [configs/model/baseline.yaml]
    calibration_fraction: 0.20
    min_calibration_size: 8
    min_training_size: 8
    conformal_alpha: 0.10
    min_std: 1.0e-6
    variance_scale_bounds: [0.25, 4.0]
    refit_full: true
  acquisition:
    plugin: hybrid_batch
    exploitation_fraction: 0.50
    exploration_fraction: 0.25
    knowledge_fraction: 0.25
    ucb_beta: 1.0
    diversity_lambda: 0.10
    ood_penalty: 0.25
    knowledge_fitness_weight: 0.25
    validation_prior_weight: 1.0
validation:
  enabled: true
  predictor_models: []
  wet_weight: 1.0
  dry_weight_cap: 0.20
  recency_decay: 0.85
  rethink_enabled: true
evaluation:
  metrics: [spearman, pearson, mse, rmse, ndcg, top_k_hit, top_k_recall,
    regret_at_k, interval_90_coverage, gaussian_nll]
  top_k: 10
output:
  artifacts: [json, csv, markdown, svg, reasoning]
  top_k: 16
hierarchical_hypothesis:
  enabled: true
  required_channels: [physchem, conservation, structure]
  max_parallel_branches: 3
  child_sample_batch_size: 8
  child_max_parallel_batches: 2
  max_child_revision_attempts: 1
  max_main_revision_attempts: 2
  formal_fail_closed: true
  subcritic_mode: remote
  child_scientist_profiles:
    physchem: physchem_v1
    conservation: conservation_v1
    structure: structure_v1
  child_critic_profiles:
    physchem: physchem_v1
    conservation: conservation_v1
    structure: structure_v1
  main_scientist_profile: synthesis_v1
  main_critic_profile: hypothesis_v1
  child_max_tokens: 4096
  child_critic_max_tokens: 2048
  main_critic_max_tokens: 4096
  main_max_input_chars: 160000
  child_max_input_chars: 120000
  critic_max_input_chars: 120000
kg_interaction:
  enabled: true
  enabled_operators:
    - hypothesis_context
    - explain_variant
    - compare_variants
    - query_physchem_delta
    - query_evolutionary_profile
    - query_structure_environment
    - query_feature_bundle
    - query_kg_truncation_audit
    - query_assay_association
    - query_evidence_provenance
  feature_tool_strategy: independent_and_joint
  feature_channels: [physchem, conservation, structure]
  feature_variant_limit: 2
  truncation_audit_enabled: true
  truncation_audit_items:
    - physchem
    - conservation
    - structure
    - HAS_PHYSCHEM_DELTA
    - HAS_EVOLUTIONARY_CONTEXT
    - OCCURS_IN_ENVIRONMENT
    - MutationEffectEstimate
    - HAS_EPISTASIS_ESTIMATE
  truncation_audit_sample_rows: 3
  max_tool_calls: 15
  max_rows: 24
  use_counterevidence: true
  stop_when_sufficient: false
