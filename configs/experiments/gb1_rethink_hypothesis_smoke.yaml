# Offline three-round GB1 smoke campaign for hypothesis-level ReThink.
# Round selection and validation do not use a fitness predictor. Integration
# tests inject a benchmark-truth adapter only for the mandatory final evaluator.
mode: knowledge_agent
seed: 11
rounds: 3
budget_per_round: 4
candidate_limit: 32
acquisition: greedy
ucb_beta: 1.5
diversity_lambda: 0.10
task_config: configs/task/gb1_binding.yaml
model_config: configs/model/baseline.yaml
knowledge_config: configs/knowledge/gb1.yaml
output_root: artifacts/gb1-rethink-hypothesis-smoke
llm_provider: mock
critic_config: configs/critic/scientific_v1.yaml
critic:
  max_revision_attempts: 0
  on_reject: safe_fallback
  on_exhausted: safe_fallback
knowledge_enabled: true
score_shuffle: false
evidence_deletion: false
run_label: GB1-RETHINK-HYPOTHESIS-SMOKE
condition: gb1_rethink_hypothesis_smoke
generation:
  selection_driver: agent_uq
  use_fitness_predictors: false
  predictor_models: []
  hypothesis_weight: 1.0
  evidence_weight: 0.65
  prior_weight: 0.80
  uncertainty_beta: 0.75
  predictor_weight: 0.0
  gp_length_scale: 1.0
  hypothesis_recency_decay: 0.85
validation:
  enabled: false
  predictor_models: []
  wet_weight: 1.0
  dry_weight_cap: 0.20
  recency_decay: 0.85
  rethink_enabled: true
  rethink_mode: hypothesis
evaluation:
  metrics: [spearman, pearson, mse, rmse, interval_90_coverage, gaussian_nll]
  top_k: 8
output:
  artifacts: [json]
  top_k: 8
kg_interaction:
  enabled: true
  enabled_operators: [hypothesis_context, explain_variant, compare_variants,
    query_physchem_delta, query_evolutionary_profile, query_structure_environment,
    query_assay_association, query_evidence_provenance]
  max_tool_calls: 8
  max_rows: 12
  use_counterevidence: true
  stop_when_sufficient: false
