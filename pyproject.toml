[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-agents"
version = "0.1.0"
description = "Auditable virtual directed-evolution agents for protein fitness optimization"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "fitness-agents contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.40,<4"]
rag = ["sentence-transformers>=3,<6"]
rag-docs = ["docling>=2,<3"]
kermut = [
  "torch>=2.2,<3",
  "gpytorch>=1.11,<2",
  "fair-esm>=2.0,<3",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
fitness-agents = "fitness_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fitness_agents.models.backends" = ["KERMUT_LICENSE.txt"]
"fitness_agents.agents" = [
  "critic_profiles/scientific_v1/*.md",
  "critic_profiles/scientific_v1/*.yaml",
  "critic_profiles/scientific_v1/*.json",
  "critic_profiles/scientific_v1/*.jsonl",
  "profiles/scientist/scientific_v1/*.md",
  "profiles/scientist/scientific_v1/*.yaml",
  "profiles/rethink/scientific_v1/*.md",
  "profiles/rethink/scientific_v1/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: multi-module integration tests",
  "e2e: end-to-end campaign tests",
  "leakage: hidden-label and prompt leakage tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
