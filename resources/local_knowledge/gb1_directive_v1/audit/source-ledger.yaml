source_spans:
  - source_span_id: SS-001
    publication_id: PUB-001
    locator: RCSB record lines 15-50
    support: 1PGA is a 56-residue GB1 structure at 2.07 Å with a tightly packed hydrophobic core between a four-stranded beta sheet and an alpha helix.
    scientific_credibility: high
    task_applicability: high
  - source_span_id: SS-002
    publication_id: PUB-002
    locator: PDBj record lines 14-32
    support: 1FCC is an X-ray structure of a protein G fragment bound to human IgG Fc at 3.2 Å.
    scientific_credibility: high
    task_applicability: medium
  - source_span_id: SS-003
    publication_id: PUB-003
    locator: full text lines 97-105
    support: Nearly every GB1 single mutant was measured for thermodynamic stability; burial largely governs positional sensitivity and stability predictors remain imperfect.
    scientific_credibility: high
    task_applicability: high_for_stability
  - source_span_id: SS-004
    publication_id: PUB-003
    locator: full text lines 152-180
    support: Positions 41 and 54 are particularly stability sensitive; interior burial predicts destabilization; glycine and proline incorporation is often deleterious.
    scientific_credibility: high
    task_applicability: high_for_stability
  - source_span_id: SS-005
    publication_id: PUB-003
    locator: full text lines 292-304
    support: Fitness and thermodynamic stability are not interchangeable; models separating folding and binding improve interpretation.
    scientific_credibility: high
    task_applicability: high_as_boundary
  - source_span_id: SS-006
    publication_id: PUB-001
    locator: official 1PGA coordinates, in-memory heavy-atom distance calculation
    support: Positions 39/54 and 41/54 have minimum heavy-atom distances of approximately 3.81 Å and 3.67 Å in the deposited structure.
    scientific_credibility: high_for_coordinates_medium_for_inference
    task_applicability: high

evidence_groups:
  - evidence_group_id: EG-001
    theme: fold_and_stability_gate
    source_spans: [SS-001, SS-003, SS-004]
    independence: two_publication_families
    conflict: none_on_direction
  - evidence_group_id: EG-002
    theme: local_contact_coupling
    source_spans: [SS-001, SS-006]
    independence: one_structure_record_plus_derived_geometry
    conflict: mutant_repacking_unobserved
  - evidence_group_id: EG-003
    theme: binding_interface_scope
    source_spans: [SS-002, SS-005]
    independence: structure_plus_thermodynamic_boundary
    conflict: exact_site_contribution_not_established

atomic_claims:
  - atomic_claim_id: AC-001
    evidence_group_id: EG-001
    claim: Treat changes at positions 41 and 54 as stability-sensitive until a candidate preserves backbone and packing compatibility.
    claim_type: direct_plus_conservative_inference
    scientific_credibility: high
    task_applicability: high
    permission: explanation_only
  - atomic_claim_id: AC-002
    evidence_group_id: EG-002
    claim: Evaluate positions 39 and 54 jointly because their wild-type side chains are in direct contact range.
    claim_type: structure_derived
    scientific_credibility: medium_high
    task_applicability: high
    permission: explanation_only
  - atomic_claim_id: AC-003
    evidence_group_id: EG-003
    claim: Interpret position-40 chemistry as an interface hypothesis separately from the folding gate.
    claim_type: bounded_inference
    scientific_credibility: medium
    task_applicability: medium_high
    permission: explanation_only
  - atomic_claim_id: AC-004
    evidence_group_id: EG-001
    claim: Preserve the geometry of nearby sensitive aromatic core residues when changing the four benchmark positions.
    claim_type: conservative_structure_inference
    scientific_credibility: medium_high
    task_applicability: high
    permission: explanation_only
  - atomic_claim_id: AC-005
    evidence_group_id: EG-001
    claim: Use stability evidence as a gate or confidence modifier, not as a binding-fitness proxy.
    claim_type: direct_boundary
    scientific_credibility: high
    task_applicability: high
    permission: explanation_only

logic_units:
  - logic_unit_id: LU-001
    atomic_claims: [AC-001]
    inference: If a proposal changes positions 41 or 54, require a small matched comparison that tests backbone or packing compatibility before prioritizing interface novelty.
    falsifier: comparable candidates that violate the gate consistently retain folding-compatible behavior
  - logic_unit_id: LU-002
    atomic_claims: [AC-002]
    inference: Compare joint residue-class balance at 39/54 rather than scoring each position independently.
    falsifier: joint size balance has no repeatable effect across matched backgrounds
  - logic_unit_id: LU-003
    atomic_claims: [AC-003]
    inference: Hold fold-sensitive positions constant when comparing alternative chemistry classes at position 40.
    falsifier: interface-class differences disappear when fold context is controlled
  - logic_unit_id: LU-004
    atomic_claims: [AC-004]
    inference: Penalize simultaneous bulky changes that crowd fixed neighboring aromatics unless compensated by a matched reduction nearby.
    falsifier: structural checks show no clash or the crowded class repeatedly outperforms its matched control
  - logic_unit_id: LU-005
    atomic_claims: [AC-005]
    inference: Reject deterministic binding conclusions drawn only from stability evidence and preserve at least one interface-diverse candidate.
    falsifier: unavailable because this is a validity boundary rather than a directional biological claim
