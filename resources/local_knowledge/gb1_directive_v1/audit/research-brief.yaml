schema_version: research-brief:v1
brief_id: RB-GB1-DIRECTIVE-V1
created_at: '2026-08-24T00:00:00+08:00'
status: research_candidate
human_reviewed: false
selection_eligible: false
permission: explanation_only
question: >-
  Which label-independent structural and biophysical rules can make GB1
  four-position recommendations more precise while preserving diversity and
  explicit abstention?
target: GB1 immunoglobulin-binding domain
task: binding-fitness candidate recommendation evaluated only by a sealed benchmark-truth adapter
allowed_evidence:
  - official GB1 and Fc-complex structure records
  - independently measured GB1 thermodynamic stability
  - primary non-target-label protein-engineering evidence with explicit transfer limits
forbidden_evidence:
  - benchmark mutation labels, rankings, fitness tables, known optima, and dataset mirrors
  - OpenAlex
  - out-of-scope protein sources prohibited by project policy
  - files denied by the active AvoidRead policy
runtime_boundaries:
  sol_role: research_evidence_and_skill_iteration_only
  candidate_generation: existing_deepseek_qwen_path
  kermut: forbidden
  benchmark_feedback: aggregate_and_blinded_only
stopping_rule: >-
  Release a research-candidate bundle when each card has a direct primary or
  official source and an explicit boundary; iterate at most three versions and
  stop earlier only when the frozen paired benchmark criterion passes.
