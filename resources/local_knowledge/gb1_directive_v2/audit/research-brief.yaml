schema_version: research-brief:v2
brief_id: RB-GB1-DIRECTIVE-V2
status: frozen
research_mode: evidence_recompilation
question: >-
  Can stage-specific, single-card retrieval turn the existing non-label-leaking GB1 evidence
  into more direct decision support than an omnibus five-card context?
feedback_scope: aggregate_blinded_only
observed_feedback:
  complete_pairs: 5
  intended_card_runs: 5
  median_final_best_delta: 0.0
  mean_auc_delta: -0.11738242800799994
