schema_version: scientific-research-log:v1
research_date: 2026-08-18
research_question: >-
  Which target-independent, citation-supported procedures can make a protein
  directed-evolution campaign operational from parent qualification through
  library construction, screening, iterative selection, and model-guided updates?
inclusion_criteria:
  - English-language DOI-backed publications.
  - Primary research, protocols, or authoritative methods reviews with a resolvable operational locator.
  - Target-independent actions that state an intervention and an observable readout.
  - Evidence relevant to protein library construction, screening, selection, or round decisions.
exclusion_criteria:
  - Target assay labels, held-out fitness measurements, or preferred target variants.
  - Metadata-only candidates whose title or abstract did not support a saved action.
  - Generic warnings without an executable intervention.
  - Long copied passages or source text.
discovery_routes:
  - route: openalex_fallback
    filters: {language: en, result_limit: 8_to_10, ranking: relevance_or_cited_by_count}
    queries:
      - directed evolution practical library design assay screening throughput
      - error-prone PCR mutation rate functional protein library directed evolution
      - site saturation mutagenesis reduced codon library coverage NDT 22c-trick
      - DNA shuffling SCHEMA protein recombination directed evolution
      - directed evolution counterselection enzyme substrate specificity negative selection
      - protein stability promotes evolvability directed evolution permissive mutations
      - droplet microfluidics ultrahigh throughput directed evolution enzyme screening
      - machine learning assisted directed evolution protein engineering experimental cycle
  - route: web_and_primary_repository_search
    filters: {language: en, preferred_domains: [pmc.ncbi.nlm.nih.gov, pubmed.ncbi.nlm.nih.gov, doi.org]}
    queries:
      - 'site:pmc.ncbi.nlm.nih.gov directed evolution library quality screening assay protein engineering practical review'
