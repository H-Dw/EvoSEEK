verification:
  publication_identity: Crossref REST metadata checked independently for every new DOI.
  claim_support: Publisher, PubMed, or PubMed Central abstract or full-text locator checked per CitationSupport record.
  deduplication_key: normalized lowercase DOI
  catalog_path: catalog/publications.yaml
  saved_claims_path: claims
limitations:
  - Twenty pre-existing citation supports remain marked as not verified against full source.
  - Closed publications were used only where an inspected abstract or method scope entailed the saved statement.
  - No target-specific overlay or candidate fitness effect was created.
